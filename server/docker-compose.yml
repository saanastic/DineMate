version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=dinemate
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=dinemate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
